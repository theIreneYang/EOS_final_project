<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Huh?</title>
<style>
:root{color-scheme:dark;--size:36px;--bg:#090e16;--surface:#111c29;--surface-b:#171d30;--control:#1b293b;--text:#f2f6fc;--line:#33435a;--muted:#adbbce;--past:#bac6d8;--a:#70e5c7;--b:#b2bcff;--error:#ffb9a9}
:root[data-theme="light"]{color-scheme:light;--bg:#edf2f7;--surface:#fff;--surface-b:#f8f9ff;--control:#fff;--text:#152337;--line:#c4cfdd;--muted:#536479;--past:#536479;--a:#087761;--b:#5554b6;--error:#b42d24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Microsoft JhengHei",sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:26px;margin:0}#connection{margin-left:auto;font-size:13px;color:var(--muted)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{background:var(--control);color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer}label{font-size:13px;display:flex;align-items:center;gap:7px}input{width:100px;accent-color:var(--a)}output{min-width:2ch;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:16px;padding:0 20px}main.stacked{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}.panel{--accent:var(--a);display:flex;flex-direction:column;padding:clamp(18px,3vw,36px);background:var(--surface);border:1px solid var(--line);border-radius:24px;min-height:0;min-width:0;overflow:hidden}.panel.b{--accent:var(--b);background:var(--surface-b)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.speaker{font-size:18px;font-weight:750;color:var(--accent)}.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}.wave{display:none;width:72px;height:28px;object-fit:contain;border-radius:6px}.recording .wave{display:block}.recording .status{color:var(--accent)}.offline .wave{display:none}.offline .status{color:var(--error)}
.textwrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;margin:20px 0 12px;padding:8px 4px;scrollbar-width:thin}.lyrics{list-style:none;margin:0;padding:0;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:24px}.lyric{border-left:3px solid transparent;padding-left:16px;color:var(--past)}.lyric.current{color:var(--text);border-color:var(--accent)}.subtitle{margin:6px 0 0;font-size:var(--size);line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.current .subtitle{font-weight:650}.stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.current .stamp{color:var(--accent)}.empty{color:var(--muted);font-size:var(--size);overflow-wrap:anywhere}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.meta{font-size:12px;color:var(--muted);line-height:1.6;min-height:20px}.follow{font-size:12px;padding:6px 10px}.error{color:var(--error);font-size:13px;margin-top:8px}.help{font-size:11px;color:var(--muted);padding:10px 24px}.projection h1,.projection .help{display:none}.projection header{padding:8px 16px}.projection main{padding:0 12px 12px;gap:12px}.projection .panel{padding:24px}[hidden]{display:none!important}button:focus-visible,select:focus-visible,input:focus-visible,.textwrap:focus-visible{outline:3px solid var(--a);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.recording .wave{display:none}}
@media(max-width:650px){header{padding:10px;gap:10px}.tools{gap:6px}button,select{font-size:12px;padding:7px 8px}main{padding:0 8px;gap:8px}.panel,.projection .panel{padding:14px;border-radius:18px}.speaker{font-size:16px}.status{font-size:12px}.lyric{padding-left:8px}.wave{width:48px}input{width:70px}.help{padding:8px 12px}}
</style></head><body>
<header><h1>Huh?</h1><div class="tools"><label>排列 <select id="layout"><option value="side">左右分割</option><option value="stacked">上下分割</option></select></label><label>外觀 <select id="theme"><option value="dark">深色模式</option><option value="light">淺色模式</option></select></label><label>字幕大小 <input id="size" type="range" min="12" max="72" step="1" value="36"><output id="sizeValue" for="size">36</output></label><button id="project" aria-pressed="false">投放模式</button><button id="fullscreen">全螢幕</button></div><span id="connection" role="status">正在連線…</span></header>
<main id="panels"></main><div class="help">最新字幕會亮起並自動跟隨；往上捲動可查看歷史，再按「回到最新」繼續跟隨。時間戳為辨識完成的本地時間。波形表示語音輸入狀態，不代表音量；字幕於整段辨識完成後更新。</div>
<script>
'use strict';
const $=id=>document.getElementById(id),histories={A:new Map(),B:new Map()},following={A:true,B:true};let session=null;
for(const id of ['A','B']){
 const p=document.createElement('section');p.id='panel'+id;p.className='panel '+(id==='B'?'b':'');p.setAttribute('aria-label','User '+id+' 字幕');
 p.innerHTML='<div class="top"><span class="speaker">User '+id+'</span><span class="status" role="status"><img class="wave" src="/audiowave.gif" alt="" aria-hidden="true"><span id="status'+id+'">等待音檔</span></span></div><div class="textwrap" id="scroll'+id+'" tabindex="0" aria-label="User '+id+' 字幕歷史"><p id="empty'+id+'" class="empty">等待 User '+id+' 的第一段語音…</p><ol id="lyrics'+id+'" class="lyrics" aria-live="polite" aria-relevant="additions" hidden></ol></div><div class="footer"><span id="meta'+id+'" class="meta">尚無字幕</span><button id="follow'+id+'" class="follow" hidden>回到最新 ↓</button></div><div id="error'+id+'" class="error" role="status"></div>';
 $('panels').append(p);$('scroll'+id).onscroll=()=>{const b=$('scroll'+id);following[id]=b.scrollHeight-b.scrollTop-b.clientHeight<36;$('follow'+id).hidden=following[id]};$('follow'+id).onclick=()=>{following[id]=true;scrollToLatest(id)};
}
function scrollToLatest(id){const b=$('scroll'+id);b.scrollTop=b.scrollHeight;$('follow'+id).hidden=true}
function timestamp(r){if(r.finished_at){const d=new Date(r.finished_at);if(!Number.isNaN(d.getTime()))return d.toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})}const t=Math.max(0,Math.floor(Number(r.finished_at_s)||0));return '工作階段 '+String(Math.floor(t/3600)).padStart(2,'0')+':'+String(Math.floor(t/60)%60).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function resetHistory(){for(const id of ['A','B']){histories[id].clear();$('lyrics'+id).replaceChildren();$('lyrics'+id).hidden=true;$('empty'+id).hidden=false;following[id]=true;$('follow'+id).hidden=true;$('meta'+id).textContent='尚無字幕';$('error'+id).textContent=''}}
function render(s){
 if(session!==null&&s.session_id!==session)resetHistory();session=s.session_id;
 for(const id of ['A','B']){
  const p=$('panel'+id),input=(s.inputs||{})[id]||{},waiting=s.waiting.filter(x=>x.client_id===id),active=s.active&&s.active.client_id===id,results=s.results.filter(x=>x.client_id===id),r=(s.latest||{})[id]||results.at(-1);
  p.classList.toggle('recording',!!input.recording);const labels=[];if(input.recording)labels.push('語音輸入中');if(input.uploading)labels.push('音檔上傳中');if(active)labels.push('辨識中 #'+s.active.sequence);if(waiting.length)labels.push('排隊中 '+waiting.length+' 段');$('status'+id).textContent=labels.join(' · ')||(r?(r.ok?'辨識完成 · 等待下一段':'請求失敗 · 可重試'):'等待音檔');
  let changed=false;const candidates=[...results,(s.subtitles||{})[id],r].filter(x=>x&&x.ok).sort((a,b)=>a.sequence-b.sequence);
  for(const item of candidates){const key=item.request_id||item.sequence;if(!histories[id].has(key)){histories[id].set(key,item);changed=true}}
  if(changed){
   const all=[...histories[id].values()].sort((a,b)=>a.sequence-b.sequence),list=$('lyrics'+id),nodes=new Map([...list.children].map(el=>[el.dataset.key,el]));
   for(const item of all){const key=String(item.request_id||item.sequence);let line=nodes.get(key);if(!line){line=document.createElement('li');line.className='lyric';line.dataset.key=key;const stamp=document.createElement('time');stamp.className='stamp';if(item.finished_at)stamp.dateTime=item.finished_at;stamp.textContent=timestamp(item)+' · #'+item.sequence;const text=document.createElement('p');text.className='subtitle';text.textContent=item.text||'（未辨識出文字）';line.append(stamp,text);list.append(line)}line.classList.toggle('current',item===all.at(-1))}
   $('empty'+id).hidden=true;list.hidden=false;const latest=all.at(-1);$('meta'+id).textContent=all.length+' 段字幕 · 最新 #'+latest.sequence+' · 辨識 '+Number(latest.asr_seconds||0).toFixed(2)+' 秒';if(following[id])scrollToLatest(id);
  }
  $('error'+id).textContent=r&&!r.ok?'最新請求失敗：'+(r.error||'請重試'):'';
 }
}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error();const s=await r.json();if(!Array.isArray(s.results)||!Array.isArray(s.waiting))throw Error();render(s);document.body.classList.remove('offline');$('connection').textContent='● 已連線 · 自動更新'}catch(e){document.body.classList.add('offline');$('connection').textContent='連線中斷 · 自動重試';for(const id of ['A','B'])$('status'+id).textContent='無法同步 · 保留字幕'}finally{setTimeout(poll,500)}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function followAll(){for(const id of ['A','B'])if(following[id])scrollToLatest(id)}
function layout(v){$('layout').value=v;$('panels').classList.toggle('stacked',v==='stacked');followAll()}layout(get('eosSplitLayout')==='stacked'?'stacked':'side');$('layout').onchange=()=>{layout($('layout').value);save('eosSplitLayout',$('layout').value)};
function size(v){$('size').value=v;$('sizeValue').textContent=v;document.documentElement.style.setProperty('--size',v+'px');followAll()}const n=Number(get('eosSplitSize'));size(n>=12&&n<=72?n:36);$('size').oninput=()=>{size($('size').value);save('eosSplitSize',$('size').value)};
function theme(v){$('theme').value=v;document.documentElement.dataset.theme=v}theme(get('eosSplitTheme')==='light'?'light':'dark');$('theme').onchange=()=>{theme($('theme').value);save('eosSplitTheme',$('theme').value)};
$('project').onclick=()=>{const on=document.body.classList.toggle('projection');$('project').textContent=on?'離開投放':'投放模式';$('project').setAttribute('aria-pressed',String(on));followAll()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('connection').textContent='請按 F11 開啟全螢幕'}};window.addEventListener('resize',followAll);poll();
</script></body></html>
